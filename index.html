<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>成語神話卷軸 RPG</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3e2b8;--card:#fff8e1;--ink:#4a2c10;--line:#a9742f;--red:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1b0c;--card:#3d2a14;--ink:#f6e3b4;--line:#c99444}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;font-size:20px;min-height:100vh}
.card{background:var(--card);border:4px double var(--line);border-radius:16px}
.btn{background:linear-gradient(#e0a43a,#b7721c);color:#fff;border:3px solid #6d3d0c;border-radius:14px;padding:10px 20px;font-weight:700;font-size:22px;cursor:pointer;text-shadow:0 1px 2px #0006}
.btn:active{transform:scale(.96)}
.tab{border:3px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--card);cursor:pointer;font-weight:700;white-space:nowrap}
.tab.on{background:#b7721c;color:#fff}
.map{overflow-x:auto;padding:30px 20px;background:repeating-linear-gradient(90deg,#0000 0 80px,#a9742f14 80px 82px)}
.row{display:flex;align-items:center;width:max-content}
.seg{width:34px;height:0;border-top:5px dashed var(--line)}
.node{width:64px;height:64px;border-radius:50%;border:4px solid #6d3d0c;background:#ffe9a8;color:#4a2c10;font-weight:800;font-size:24px;cursor:pointer;flex:none}
.node.boss{width:84px;height:84px;background:#f5a09a;border-color:#7a1410;font-size:34px}
.node.done{background:#9bd98a}.node.lock{background:#bbb;color:#777;cursor:not-allowed}
.node.cur{animation:pulse 1s infinite alternate}
.opt{display:block;width:100%;text-align:center;font-size:32px;font-weight:800;padding:14px;margin:8px 0;border:4px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{background:#8fd694;color:#123}.opt.no{background:#f19b95;color:#123}
.shake{animation:shake .45s}.hit{animation:hit .5s}
.bar{height:22px;border-radius:11px;background:#0003;overflow:hidden;border:2px solid #6d3d0c}
.bar>div{height:100%;background:linear-gradient(#ff6b5e,#c42a1d);transition:width .6s}
.cap{animation:cap 1.6s forwards}.glow{animation:glow 1.4s infinite alternate}
.cert{background:linear-gradient(135deg,#fff3c4,#f2c14e);border:10px double #a8741a;color:#5a3405}
@keyframes pulse{to{transform:scale(1.18);box-shadow:0 0 18px #ffb300}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
@keyframes hit{0%{filter:brightness(3);transform:scale(1.2) rotate(8deg)}100%{filter:none;transform:none}}
@keyframes cap{0%{transform:scale(1)}60%{transform:scale(.3) rotate(540deg)}100%{transform:scale(0) translateY(-80px)}}
@keyframes glow{to{filter:drop-shadow(0 0 20px gold);transform:scale(1.12)}}
#lobby{position:fixed;inset:0;z-index:50;overflow:hidden;background:#0b1030}
.world{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}
.pin{position:absolute;transform:translate(-50%,-50%)}
.tag{animation:floaty 3s ease-in-out infinite alternate;background:#0b1030d9;color:#fff;border:3px solid #7de3ff;border-radius:14px;padding:6px 12px;box-shadow:0 0 18px #7de3ff;cursor:pointer;text-align:center;font-size:clamp(14px,1.6vw,22px);white-space:nowrap;font-family:inherit}
.tag.got{border-color:gold;box-shadow:0 0 24px gold}
.tag:hover{transform:scale(1.1)}
@keyframes floaty{to{transform:translateY(-10px)}}

.hidden{display:none!important}
#scene{position:fixed;inset:0;z-index:50;overflow:hidden;background:#0b1030}
.scn{position:relative;width:100%;height:100%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
#modal{position:fixed;inset:0;z-index:100}
.spk{background:#2a8fbd;color:#fff;border:3px solid #15506b;border-radius:12px;padding:4px 12px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
.hbtn{border:5px solid transparent;border-radius:16px;background:#0001;padding:8px;cursor:pointer;color:inherit;font-family:inherit}
.hbtn.on{border-color:#e0a43a;background:#ffe9a8;color:#4a2c10}
.lab{background:var(--card);color:var(--ink);padding:0 8px;border-radius:8px;font-size:14px;display:inline-block;margin-top:2px}
.arena{position:relative;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 14px;border-radius:12px;min-height:220px;overflow:hidden;background:linear-gradient(#0001,#0002)}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:2}
.sgbar{display:flex;gap:3px;width:min(200px,38vw)}
.sg{flex:1;height:16px;border-radius:4px;border:2px solid #6d3d0c;background:#0005;display:block}
.sg.on{background:linear-gradient(#ff6b5e,#c42a1d)}.sg.on.g{background:linear-gradient(#8be88b,#1f9d3a)}
.nmtag{background:#000a;color:#fff;border-radius:8px;padding:0 10px;font-size:14px}
.proj{position:absolute;width:44px;height:44px;border-radius:50%;z-index:5;pointer-events:none}
.proj.red{background:radial-gradient(circle at 40% 40%,#fff3b0,#ff8a1f 40%,#e02a12 75%,#a02000);box-shadow:0 0 18px 8px #ff5a1f99}
.proj.green{background:radial-gradient(circle at 40% 40%,#eaffd0,#59f06a 40%,#16a34a 75%);box-shadow:0 0 18px 8px #3cff7a99}
.proj.iron{border-radius:0;background:none}
.burst{position:absolute;width:30px;height:30px;border-radius:50%;z-index:6;pointer-events:none;animation:burst .45s forwards}
.burst.red{background:#ff8a1f}.burst.green{background:#59f06a}.burst.iron{background:#c9ced6}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:.9}to{transform:translate(-50%,-50%) scale(4);opacity:0}}
</style>
</head>
<body>
<div id="lobby" class="hidden"></div>
<div id="scene" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="main" class="max-w-4xl mx-auto p-3 hidden">
  <div class="flex items-center justify-between gap-2 mb-2">
    <h1 class="text-2xl md:text-3xl font-black">📜 成語神話卷軸</h1>
    <div class="flex gap-2"><button class="tab" onclick="settings()">⚙ 設定</button><button class="tab" onclick="finale(true)">🧪 測試大結局</button></div>
  </div>
  <div id="app"></div>
</div>
<script>
/* ============ 設定區（可自行修改）============
 背景音樂：把 mp3 放進 audio/ 資料夾，再把檔名填在下面；留空 "" 代表不播放。
 可用鍵：lobby(世界地圖) story(故事) map(各島地圖) battle(戰鬥) boss(魔王戰) ending(結局)
 也可替單一島嶼指定：island1 ~ island6（優先於 map）。例：lobby:"lobby.mp3" */
const BGM={lobby:"",story:"",map:"",battle:"",boss:"",ending:""};
const BGM_DIR="audio/";

/* ============ 題庫 idiomDatabase ============
 格式：[成語, 白話解釋, 趣味造句]
 ★未來可在此繼續貼上擴充題庫：直接在各島陣列最後加一行即可（成語須為四字）。
 挖空與 4 個選項由程式自動產生（干擾字取自同島其他成語）。 */
const idiomDatabase = {
island1:[ // 第一島：康軒版國語一上、一下「成語加油站」共 236 個成語（可在此繼續貼上擴充題庫）
["一拍即合","比喻同類型的人或事物，一相遇即十分合適。","他們兩人都喜歡看同一種題材的電影，所以才剛認識便一拍即合。"],
["七手八腳","形容人多，動作紛亂沒條理。","筱琪跌倒受傷了，大家七手八腳的把她送到健康中心。"],
["手舞足蹈","形容非常高興喜悅的樣子。","大家一聽到下星期有戶外教育活動，就高興得手舞足蹈起來。"],
["左鄰右舍","附近的鄰居。","媽媽和左鄰右舍相處得很好，他們都會相互幫忙。"],
["左思右想","反覆的想了又想。","放學途中，他左思右想，一直想不起來忘了帶什麼東西回來。"],
["左右逢源","比喻辦事得心應手或處事圓融。","她憑著協商的長才，左右逢源的把事情處理完了。"],
["你推我擠","形容人潮擁擠不堪。","排隊時應該站好，不要你推我擠以免發生意外受傷。"],
["別無他法","沒有其他辦法。","時間快來不及了，別無他法，只好先出發再說。"],
["箭也似的","形容如飛箭般的快速。","他箭也似的跑了出去，不知道發生什麼事？"],
["七上八下","形容心情起伏不定，驚惶不安。","我第一次上臺報告，心裡七上八下，非常緊張。"],
["力爭上游","努力求取上進。","他的家境雖然貧苦，但仍力爭上游，努力學習，令人敬佩。"],
["不相上下","形容彼此差不多，難以分出高下。","他們兩人的表現不相上下，希望都有不錯的成績。"],
["如此這般","這樣那樣，對事件或動作不明說，不一一列舉的概括性詞語。","老師把事情如此這般地說了一遍，大家就都明白了。"],
["口是心非","嘴上說的和心裡想的不一致。","他這個人不誠實，口是心非，所以大家都不相信他的話。"],
["鹿死誰手","比喻共同爭奪一件事物，不知道誰能取得最後的勝利。鹿：古代打獵的目標，轉而比喻想要爭奪的東西。","這兩校球隊實力差不多，大家都很好奇，比賽究竟鹿死誰手？"],
["省油的燈","比喻容易應付的人。","你別小看這個人，他雖然年輕，但可不是一個省油的燈。"],
["依然故我","仍舊和從前一樣，指情況依舊，沒有任何變化。故我：從前的我。","無論誰勸他，他依然故我，不管雨勢多大，還是堅持去爬山。"],
["完好如初","完整無缺，和原來一樣。","這個花瓶從祖父時流傳至今，歷經了這麼多年還是完好如初。"],
["多此一舉","做不必要的、多餘的事情。","教室已經很乾淨了，你何必多此一舉再掃一次呢？"],
["多采多姿","形容姿態多樣，色彩迷人，後來引申為內容豐富華麗，且變化多端。","他年紀輕輕就做了那麼多樣工作，經歷真是多采多姿。"],
["沒完沒了","沒有終了的時候。了：結束的意思。","這件事總是做不完，好像沒完沒了。"],
["個中滋味","其中的體驗與感受。","身為父母的喜悅與艱辛只有自己經歷過，才能了解個中滋味。"],
["一日三秋","一天不見面，就好像過了三年一樣，形容非常思念。","想念好友，就好像一日三秋。"],
["一字千金","比喻文辭精妙，價值極高。或用來形容價值極高的作品。","這本推理小說寫得很好，得到很高的評價，真是一字千金。"],
["心平氣和","不急躁、不發怒。","里長很有耐心，總是能心平氣和的幫人解決問題。"],
["敬陪末座","比喻在比賽中得到最後一名。","教練叮嚀我們平常要努力練球，以免在比賽中只能敬陪末座。"],
["遊山玩水","遊覽山水景緻。","他喜歡到處遊山玩水，欣賞優美的風景。"],
["山高水長","比喻人品高潔，垂範久遠。","他高潔的人品，山高水長，可作為我們的模範。"],
["說到做到","信守承諾，講出去的話一定想辦法完成。","無論什麼事，他總是說到做到，是個有信用的人。"],
["滿頭大汗","形容工作忙碌，辛苦的樣子。","為了修好電風扇，爸爸忙得滿頭大汗。"],
["大公無私","做事公正，一點兒都不偏袒。","他做事大公無私的作風，贏得了大家的讚賞。"],
["石沉大海","比喻人離去不見蹤影，沒有音訊或事情沒有下文。","叔叔出國後，他的音訊便石沉大海，到現在都沒有來信。"],
["人山人海","形容非常多的人聚集在一起。","知名樂團來臺演出，現場人山人海，盛況空前。"],
["高朋滿座","形容高貴客人很多。","爺爺喜歡邀請三五好友到家裡玩，所以家裡時常高朋滿座。"],
["親朋好友","泛指所有的親戚、朋友。","本店開始營業，希望各位親朋好友都來光臨。"],
["此起彼落","這裡起來，那裡落下，形容連續不斷。","過年時鞭炮聲此起彼落，十分熱鬧。"],
["兩把刷子","比喻可以被人稱讚的本領。","他每次參加比賽都能獲得很好的成績，果真有兩把刷子。"],
["牛刀小試","比喻有大才能，先在小事上施展一下。","這件事對他來說只是牛刀小試，非常輕鬆就可以完成。"],
["課外讀物","教科書以外的書籍、刊物。","大量閱讀課外讀物，可以獲得許多知識。"],
["兩全其美","做事顧全雙方，使兩方面都能圓滿。","不要爭論了，我想到一個兩全其美的好辦法，可以解決這個問題。"],
["平易近人","性情寬和，容易與人親近。","主任非常平易近人，你如果有問題，可以問他。"],
["人定勝天","指人的智慧和力量，能夠克服自然阻礙，改造環境。","不要因為一時的失敗就怨天尤人，我相信人定勝天，路是自己走出來的。"],
["拖拖拉拉","做事慢吞吞，不乾脆俐落。","他做起事來總是拖拖拉拉的，缺乏效率。"],
["另眼相看","以特別的眼光或態度相待，以示重視或歧視。","在團體中我們應該一視同仁，不能因為對方身分特殊而另眼相看。"],
["自找麻煩","增加自己的負擔、困擾。","我們不該把這個問題弄得太複雜，這樣只會自找麻煩。"],
["形單影隻","指身形與影子都是孤獨的。形容孤單無伴。","他的個性孤僻，朋友比較少，每次遇見時，他都是形單影隻的獨來獨往。"],
["青出於藍","比喻弟子勝過老師，或後輩優於前輩。","他不僅學會老師教的知識，還達到更高的成就，真是青出於藍。"],
["井底之蛙","住在井底的青蛙。比喻見識淺薄的人。","我們應該到世界各地走走，增廣見聞，免得成為井底之蛙。"],
["眉開眼笑","形容非常高興。","他說話很有趣，逗得大家眉開眼笑。"],
["比手畫腳","以手腳等肢體動作輔助說明，表達想要傳達的意思。","弟弟站在窗外一直比手畫腳，我還是看不懂他的意思。"],
["班門弄斧","指在魯班門前玩弄斧頭。比喻在行家面前賣弄本事，過於高估自己的能力。班：魯班，相傳是木匠的創始人。","今天我竟然在專家面前大談科學，實在是班門弄斧。"],
["表裡如一","言行和思想完全一致。","他是個表裡如一的人，說什麼就做什麼。"],
["出人意外","出乎意料之外。","這部電影的結局出人意外，大家都感到驚奇。"],
["津津有味","形容很有滋味。","每次回故鄉，奶奶的拿手好菜總是讓我們吃得津津有味。"],
["不差什麼","不缺什麼。","這間房子布置得很好，我想不差什麼了。"],
["不知所措","不知道怎麼辦才好。","想到這次期末考試成績不理想，他就緊張得不知所措。"],
["大同小異","大體相同，但略有差異。","這兩本書的故事內容大同小異，只有圖畫比較不一樣。"],
["言之過早","在事情還沒定案或完成之前，就預先說出。","還沒看到公告，他就說自己已經獲選為隊長，實在是言之過早。"],
["一天到晚","從早到晚、整天。","他為了探究科學的奧祕，一天到晚忙著做實驗。"],
["吹牛大王","喜歡誇大、說大話的人。","他是大家公認的吹牛大王，所以朋友總是不相信他的話。"],
["打定主意","確定想法，下決定。","我已經打定主意不參加營隊，你不要再問我了。"],
["日新又新","每天不斷的追求進步、再進步。","科技不斷發展，日新又新。"],
["一路順風","一路平安順利。是送行的祝福語。","表姐要出國旅遊，上飛機前，送行的親友都祝福她一路順風。"],
["夜長夢多","比喻時間拖長了，事情可能發生不利的變化。","你還是盡早完成工作吧！以免夜長夢多。"],
["黑白分明","①黑色和白色區分明顯。②比喻清楚分辨是非善惡。","她那雙眼睛黑白分明，看起來非常聰明。"],
["五花八門","比喻花樣繁多、變化多端。","這家專賣店的運動鞋五花八門，應有盡有。"],
["萬紫千紅","形容百花盛開，多彩燦爛的景象。","春天時，公園裡百花盛開，萬紫千紅的樣子，真漂亮！"],
["走馬看花","比喻粗略、匆促的觀看，不能仔細深入了解事物。","參觀每座博物館，如果只是走馬看花，那真的太可惜了！"],
["歷歷在目","清楚明白的呈現在眼前。","他望著發黃的相片，往事歷歷在目，彷彿回到舊日時光。"],
["欣欣向榮","比喻事物蓬勃發展、繁榮興盛。","國際景氣正快速復甦中，未來的經濟表現必然會是一片欣欣向榮。"],
["各說各話","各自說不相關、不搭調的話。","他們對事情的看法不同，因此討論時總是各說各話。"],
["大快朵頤","飽食愉快的樣子。","今天媽媽煮了許多我喜歡吃的菜，我又可以大快朵頤了。"],
["病從口入","疾病是由於飲食不慎所引起的。","吃東西前要記得洗手，以免病從口入。"],
["頭昏眼花","頭腦昏沉，視線模糊。","剛才在打籃球時，他不小心被球打到，所以覺得頭昏眼花，需要休息一下。"],

/* ============ 語音朗讀（瀏覽器內建中文語音）============ */
const TTS="speechSynthesis" in window;let voice;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/zh/i.test(x.lang))}
if(TTS){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function say(t){if(!TTS||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/＿+/g,"空格"));u.lang="zh-TW";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}
const auto=t=>{if(S.set.auto)say(t)};
function stopSay(){if(TTS)speechSynthesis.cancel()}
let TXT="";const spk=(l)=>TTS?`<button class="spk" onclick="say(TXT)">🔊 ${l||"聽一聽"}</button>`:"";

function drawStory(){
  const s=ST.list[ST.i],t=s[1].replace(/\{n\}/g,nm()),last=ST.i===ST.list.length-1;

/* ============ 出題 ============ */
function makeQ(e,pool){
  // 三種題型：fill 成語填空、mean 看意思選成語、scene 看情境（造句）選成語
  const hasS=e[2]&&e[2].includes(e[0]),r=Math.random();
  const type=r<.4?"fill":(r<.7||!hasS)?"mean":"scene";
  if(type==="fill"){
    const p=Math.random()*4|0,ans=e[0][p];
    const dis=shuf([...new Set(pool.flatMap(x=>[...x[0]]))].filter(ch=>ch!==ans)).slice(0,3);
    return{e,type,p,ans,opts:shuf([ans,...dis])};
  }
  const others=shuf(pool.filter(x=>x[0]!==e[0])).slice(0,3).map(x=>x[0]);
  return{e,type,ans:e[0],opts:shuf([e[0],...others])};
}
function start(l){
  const pool=db(cur);let picks;stopSay();if(B&&B.timer)clearTimeout(B.timer);
  if(isBoss(l)){
    const n=l===20?8:5;
    const w=shuf(S.wrong[cur]).map(id=>pool.find(x=>x[0]===id)).filter(Boolean).slice(0,n);
    picks=w.concat(shuf(pool.filter(x=>!w.includes(x))).slice(0,n-w.length));
    battle(l,picks);
  }else{
    picks=shuf(pool).slice(0,3);
    TXT=picks.map(e=>`${e[0]}。意思是：${e[1]}。造句：${e[2]}`).join(" ");
    $("#app").innerHTML=`<div class="card p-4"><h2 class="text-2xl font-black mb-3">📖 第 ${l} 關・戰前修煉秘笈</h2>`+picks.map(e=>`<div class="mb-3 p-3 rounded-xl" style="background:#0001"><div class="text-3xl font-black text-center">${e[0]}</div><div class="mt-1"><b>解釋：</b>${e[1]}</div><div><b>造句：</b>${e[2]}</div></div>`).join("")+`<div class="text-center">${spk("朗讀秘笈")} <button class="btn" id="go">修煉完成，開始挑戰！</button> <button class="tab" onclick="map()">回地圖</button></div></div>`;
    $("#go").onclick=()=>battle(l,picks);
    auto(TXT);
  }
}

/* ============ 戰鬥 ============ */
const MINION_TINT=[0,60,150,230]; // 同一隻小妖輪第二次出現時，用不同色相區分
function mon(l){
  if(l===20)return `<img id="mon" src="${bs(cur)}" alt="" style="height:190px">`;
  if(isBoss(l))return `<img id="mon" src="${bs(cur)}" alt="" style="height:150px;filter:drop-shadow(0 0 10px #f33)">`;
  const idx=l-1-Math.floor(l/5); // 一般關卡的順序 0~15
  return `<img id="mon" src="images/minions/minion_${cur+1}${"ab"[idx%2]}.webp" alt="" style="height:140px;filter:hue-rotate(${MINION_TINT[Math.floor(idx/2)%4]}deg)">`;
}
function bar(n,on,cls){let h="";for(let i=0;i<n;i++)h+=`<i class="sg ${i<on?"on "+(cls||""):""}"></i>`;return `<div class="sgbar">${h}</div>`}
function battle(l,picks){
  const pool=db(cur),n=picks.length,hh=isBoss(l)?4:3;bgm(isBoss(l)?"boss":"battle","battle");
  // 主角血量：一般關 3 格、魔王關 4 格；妖怪血量 = 題數。
  // 一般關（clear）：答錯的成語會換個問法再考，直到小妖血條清空才過關；魔王關：固定題數，主角撐到最後就過關。
  B={l,qs:picks.map(e=>makeQ(e,pool)),i:0,hp:hh,max:hh,n,mhp:n,clear:!isBoss(l),lock:false};
  ask();
}
function ask(){
  stopSay();
  const I=ISLANDS[cur],q=B.qs[B.i],boss=isBoss(B.l);
  let qh,optSt="";
  if(q.type==="fill"){
    const word=[...q.e[0]].map((c,i)=>i===q.p?"＿":c).join("");
    TXT=`請選出空格該填的字。成語：${word}。提示：${q.e[1]}`;
    qh=`<div class="text-5xl font-black" style="letter-spacing:.2em">${word}</div><div class="mt-2 text-lg">💡 ${q.e[1]}</div>`;
  }else if(q.type==="mean"){
    TXT=`哪一個成語的意思是：${q.e[1]}。選項：${q.opts.join("、")}`;optSt="font-size:28px";
    qh=`<div class="text-lg mb-1">哪一個成語的意思是？</div><div class="text-3xl font-black" style="line-height:1.5">${q.e[1]}</div>`;
  }else{
    const sc=q.e[2].replace(q.e[0],"＿＿＿＿");
    TXT=`請選出最適合填入句子的成語。${sc}。選項：${q.opts.join("、")}`;optSt="font-size:28px";
    qh=`<div class="text-lg mb-1">哪一個成語最適合填進句子裡？</div><div class="text-2xl font-black" style="line-height:1.6">${sc}</div>`;
  }
  const bg=boss?`background-image:linear-gradient(#0002,#0006),url(images/islands/island${cur+1}.jpg);background-size:cover;background-position:center;`:"";
  $("#app").innerHTML=`<div id="stage" class="card p-3">
  <div class="font-black">第 ${B.l} 關${B.l===20?" 👺島主":boss?" 👹菁英":""}</div>
  <div id="arena" class="arena" style="${bg}">
    <div class="side"><img id="hero" src="${hb()}" alt="" style="height:130px"><div id="hbar">${bar(B.max,B.hp,"g")}</div><span class="nmtag">${nm()}</span></div>
    <div class="side">${mon(B.l)}<div id="mbar">${bar(B.n,B.mhp)}</div><span class="nmtag">${boss?I.b:"小妖"}</span></div>
  </div>
  <div class="text-center mt-3">${qh}<div class="mt-1">${spk("聽題目")}</div></div>
  <div class="grid grid-cols-2 gap-x-3 mt-2">`+q.opts.map(o=>`<button class="opt" style="${optSt}" onclick="pick(this,'${o}')">${o}</button>`).join("")+`</div><div id="fb" class="text-center min-h-8 font-bold"></div></div>`;
  B.lock=false;auto(TXT);
}
const IRON='<svg viewBox="0 0 44 44" width="44" height="44"><g fill="#8b929c" stroke="#2d3138" stroke-width="2"><circle cx="22" cy="22" r="11"/><path d="M22 1l4 10h-8zM22 43l-4-10h8zM1 22l10-4v8zM43 22l-10 4v-8zM7 7l10 3-3 3zM37 37l-10-3 3-3zM37 7l-3 10-3-3zM7 37l3-10 3 3z"/></g></svg>';
// 發射火球：kind = red（主角）／green、iron（小妖）
function shoot(kind,from,to,done){
  const ar=$("#arena"),a=ar.getBoundingClientRect(),f=from.getBoundingClientRect(),t=to.getBoundingClientRect();
  const sx=f.left+f.width/2-a.left,sy=f.top+f.height*.4-a.top,ex=t.left+t.width/2-a.left,ey=t.top+t.height*.45-a.top;
  const p=document.createElement("div");p.className="proj "+kind;p.innerHTML=kind==="iron"?IRON:"";
  p.style.left=sx+"px";p.style.top=sy+"px";ar.appendChild(p);
  const an=p.animate([{transform:"translate(-50%,-50%) scale(.6)"},{transform:`translate(calc(-50% + ${ex-sx}px),calc(-50% + ${ey-sy}px)) scale(1.1) rotate(${kind==="iron"?540:0}deg)`}],{duration:550,easing:"ease-in"});
  an.onfinish=()=>{p.remove();const bu=document.createElement("div");bu.className="burst "+kind;bu.style.left=ex+"px";bu.style.top=ey+"px";ar.appendChild(bu);setTimeout(()=>bu.remove(),500);done()};
}
function pick(btn,o){
  if(B.lock)return;B.lock=true;
  const q=B.qs[B.i],ok=o===q.ans,boss=isBoss(B.l),id=q.e[0];
  document.querySelectorAll(".opt").forEach(b=>{if(b.textContent===q.ans)b.classList.add("ok")});
  if(ok){
    if(boss)S.wrong[cur]=S.wrong[cur].filter(x=>x!==id);
    shoot("red",$("#hero"),$("#mon"),()=>{
      $("#mon").classList.add("hit");B.mhp--;$("#mbar").innerHTML=bar(B.n,B.mhp);
      $("#fb").textContent="🔥 擊中！"+q.e[0]+"：造句 "+q.e[2];
    });
  }else{
    btn.classList.add("no");
    if(!S.wrong[cur].includes(id))S.wrong[cur].push(id);
    if(B.clear)B.qs.push(makeQ(q.e,db(cur))); // 一般關：答錯的成語換個問法再考一次
    shoot(Math.random()<.5?"green":"iron",$("#mon"),$("#hero"),()=>{
      B.hp--;$("#hero").classList.add("shake");$("#stage").classList.add("shake");$("#hbar").innerHTML=bar(B.max,B.hp,"g");
      $("#fb").textContent="💥 被打中了！正確是「"+q.e[0]+"」";
    });
  }
  save();
  B.timer=setTimeout(()=>{if(B.hp<=0)return lose();if(B.clear?B.mhp<=0:B.i+1>=B.n)return win();B.i++;ask()},ok?1800:2300);
}
function lose(){
  const l=B.l;stopSay();TXT=`${nm()}，仙力耗盡了！錯的成語已放進錯題本，再挑戰一次吧！`;
  $("#app").innerHTML=`<div class="card p-6 text-center"><img src="${hs()}" alt="" style="height:140px;margin:auto;filter:grayscale(.8)"><h2 class="text-3xl font-black my-2">仙力耗盡了！</h2><p>錯的成語已放進錯題本，下次魔王關會再考你。</p><div class="mt-4">${spk("")} <button class="btn" onclick="start(${l})">再挑戰一次</button> <button class="tab" onclick="map()">回地圖</button></div></div>`;
  auto(TXT);
}
function win(){
  const l=B.l,I=ISLANDS[cur];stopSay();
  S.cleared[cur]=Math.max(S.cleared[cur],l);save();
  if(l<20){
    TXT=`${nm()}，第${l}關通過！`;
    $("#app").innerHTML=`<div class="card p-6 text-center"><img src="${hs()}" alt="" style="height:140px;margin:auto"><h2 class="text-3xl font-black my-2">第 ${l} 關通過！</h2><div class="mt-4"><button class="btn" onclick="start(${l+1})">下一關</button> <button class="tab" onclick="map()">回地圖</button></div></div>`;
    return auto(TXT);
  }
  const first=!S.relics[cur];S.relics[cur]=1;save();
  TXT=`${nm()}打敗了${I.b}，獲得法寶${I.r}！`;
  $("#app").innerHTML=`<div class="card p-6 text-center"><h2 class="text-3xl font-black">擊敗 ${I.b}！</h2>
  <div style="display:grid;place-items:center;height:230px"><img class="cap" src="${bs(cur)}" alt="" style="grid-area:1/1;height:200px"><img id="rl" class="glow hidden" src="${rs(cur)}" alt="" style="grid-area:1/1;height:190px"></div>
  <div id="rt" class="hidden text-2xl font-black">獲得法寶：${I.r}！</div>
  <div class="mt-4"><button class="btn" id="nx">繼續</button></div></div>`;
  setTimeout(()=>{$("#rl").classList.remove("hidden");$("#rt").classList.remove("hidden");auto(TXT)},1500);
  $("#nx").onclick=()=>S.relics.every(Boolean)&&first?finale(false):map();
}

/* ============ 大結局 ============ */
function finale(test){playStory(ENDING,()=>cert(test))}
function cert(test){
  view("main");bgm("ending","story");
  const total=S.cleared.reduce((a,b)=>a+b,0);
  $("#app").innerHTML=`<div class="card p-4 text-center"><div class="text-3xl font-black">🏯 天宮成語聖殿</div>
  <div class="flex justify-center gap-2 my-2 flex-wrap">${ISLANDS.map((x,i)=>`<img class="glow" src="${rs(i)}" alt="${x.r}" style="height:64px">`).join("")}</div>
  <p>六大法寶齊聚，成語世界恢復了！${test?"（測試預覽）":""}</p>
  <div class="my-3"><label>你的名字：<input id="nm" maxlength="8" value="${S.name||""}" class="border-4 rounded-xl p-2 text-center text-2xl" style="border-color:var(--line);color:#4a2c10;width:200px"></label></div>
  <div class="cert p-6 rounded-xl mx-auto" style="max-width:560px"><div class="text-3xl font-black">《齊天成語大聖》</div>
  <div class="text-xl mt-2">榮譽證書</div><img src="${hs()}" alt="" style="height:110px;margin:6px auto 0"><div class="text-4xl font-black my-2" id="cn" style="min-height:48px">${S.name||"＿＿＿＿"}</div>
  <p class="text-lg">通過六座仙島，破關 <b>${test?Math.max(total,120):total}</b> 關，<br>打敗六大妖怪，集齊六大法寶，<br>讓成語世界恢復正常，特此頒發，以資鼓勵！</p><div class="text-4xl mt-3">👑🏆</div></div>
  <div class="mt-4"><button class="tab" onclick="lobby()">🌏 世界總地圖</button></div></div>`;
  $("#nm").oninput=e=>{S.name=e.target.value;$("#cn").textContent=S.name||"＿＿＿＿";save()};
}

/* ============ 啟動 ============ */
S.hero?lobby():pickHero();
</script>
</body>
</html>
